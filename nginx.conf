server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由：/dashboard /topics 等都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API：注意 /api/ 末尾的斜杠
    location /api/ {
        proxy_pass http://tcgs-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # FastAPI 文档
    location /docs {
        proxy_pass http://tcgs-backend:8000/docs;
    }

    location /openapi.json {
        proxy_pass http://tcgs-backend:8000/openapi.json;
    }
}
